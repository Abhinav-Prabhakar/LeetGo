<svg width="760" height="440" viewBox="0 0 760 440" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">LeetGo daily reminder preview</title>
  <desc id="desc">A Discord direct message reminding a user to solve the daily challenge, with a challenge card and buttons.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="760" y2="440" gradientUnits="userSpaceOnUse">
      <stop stop-color="#080C15"/>
      <stop offset="1" stop-color="#101A18"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(620 380) rotate(-140) scale(360 280)">
      <stop stop-color="#10B981" stop-opacity="0.17"/>
      <stop offset="1" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#34D399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="avatar" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFC24B"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" stroke="#16262A" stroke-opacity="0.55"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="20" stdDeviation="20" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="760" height="440" rx="26" fill="url(#bg)"/>
  <rect width="760" height="440" rx="26" fill="url(#grid)"/>
  <rect width="760" height="440" rx="26" fill="url(#glow)"/>
  <rect x="1" y="1" width="758" height="438" rx="25" stroke="#1D3031"/>

  <text x="40" y="42" fill="#5E708A" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="700" letter-spacing="2.4">PRODUCT PREVIEW / 03</text>
  <g transform="translate(628 30)">
    <circle cx="0" cy="0" r="4" fill="#F85149" fill-opacity="0.8"/>
    <circle cx="14" cy="0" r="4" fill="#D29922" fill-opacity="0.8"/>
    <circle cx="28" cy="0" r="4" fill="#3FB950" fill-opacity="0.8"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="40" y="62" width="680" height="338" rx="18" fill="#23262D"/>

    <!-- DM header -->
    <circle cx="82" cy="100" r="18" fill="url(#avatar)"/>
    <path d="M76 94L72 100L76 106" stroke="#1B1408" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M88 94L92 100L88 106" stroke="#1B1408" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="110" y="97" fill="#F2F3F5" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700">LeetGo <tspan fill="#5865F2" font-size="9" font-weight="700" letter-spacing="0.8">APP</tspan></text>
    <text x="110" y="113" fill="#9AA4B2" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10">Today at 8:00 PM</text>
    <rect x="596" y="86" width="88" height="26" rx="13" fill="#2C3040"/>
    <text x="640" y="103" text-anchor="middle" fill="#AEB6C4" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="600">@ you</text>

    <text x="68" y="154" fill="#E8EAED" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500">Evening, alice 👋 Ready to keep the streak alive?</text>

    <!-- dm bubble / challenge embed -->
    <rect x="64" y="172" width="652" height="150" rx="12" fill="#1D2027"/>
    <rect x="64" y="172" width="4" height="150" rx="2" fill="url(#accent)"/>
    <text x="86" y="200" fill="#34D399" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="800" letter-spacing="1.4">TODAY'S DAILY CHALLENGE</text>
    <text x="86" y="230" fill="#F2F3F5" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21" font-weight="800">Two Sum</text>
    <rect x="204" y="216" width="52" height="20" rx="10" fill="#3A2D12" stroke="#6B531D"/>
    <text x="230" y="230" text-anchor="middle" fill="#FFC24B" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" font-weight="800">EASY</text>
    <text x="86" y="252" fill="#9AA4B2" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11">Acceptance 55.5% · 2h 14m left</text>

    <!-- mini progress / personal context -->
    <rect x="86" y="272" width="430" height="30" rx="8" fill="#171A20"/>
    <text x="98" y="291" fill="#7C8797" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10">Your goal</text>
    <rect x="160" y="283" width="250" height="7" rx="3.5" fill="#2A2E36"/>
    <rect x="160" y="283" width="175" height="7" rx="3.5" fill="url(#accent)"/>
    <text x="498" y="291" fill="#C7D2E1" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="700">70%</text>

    <!-- buttons -->
    <rect x="86" y="318" width="112" height="30" rx="7" fill="#5865F2"/>
    <text x="142" y="337" text-anchor="middle" fill="#FFFFFF" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700">Solve now →</text>
    <rect x="208" y="318" width="126" height="30" rx="7" fill="#2C3040"/>
    <text x="271" y="337" text-anchor="middle" fill="#D7DBE0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600">View goal</text>

    <text x="68" y="378" fill="#6F7B8C" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10">Sent in your timezone · Asia/Kolkata</text>
    <text x="692" y="378" text-anchor="end" fill="#34D399" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="700">/reminder set</text>
  </g>

  <text x="720" y="424" text-anchor="end" fill="#46566D" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="600">leetgo v3.0</text>
</svg>
