<svg width="760" height="440" viewBox="0 0 760 440" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">LeetGo cohort leaderboard preview</title>
  <desc id="desc">A Discord-style leaderboard for a study cohort with ranked members and solve counts.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="760" y2="440" gradientUnits="userSpaceOnUse">
      <stop stop-color="#080C15"/>
      <stop offset="1" stop-color="#101426"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(180 40) rotate(30) scale(360 260)">
      <stop stop-color="#6366F1" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFD76E"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" stroke="#1A2038" stroke-opacity="0.55"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="20" stdDeviation="20" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="760" height="440" rx="26" fill="url(#bg)"/>
  <rect width="760" height="440" rx="26" fill="url(#grid)"/>
  <rect width="760" height="440" rx="26" fill="url(#glow)"/>
  <rect x="1" y="1" width="758" height="438" rx="25" stroke="#232A44"/>

  <text x="40" y="42" fill="#5E708A" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="700" letter-spacing="2.4">PRODUCT PREVIEW / 02</text>
  <g transform="translate(628 30)">
    <circle cx="0" cy="0" r="4" fill="#F85149" fill-opacity="0.8"/>
    <circle cx="14" cy="0" r="4" fill="#D29922" fill-opacity="0.8"/>
    <circle cx="28" cy="0" r="4" fill="#3FB950" fill-opacity="0.8"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="40" y="62" width="680" height="338" rx="18" fill="#23262D"/>
    <rect x="40" y="62" width="5" height="338" rx="2.5" fill="url(#accent)"/>

    <text x="68" y="104" fill="#F2F3F5" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="800">🏆 Night Owls — leaderboard</text>
    <text x="68" y="124" fill="#9AA4B2" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11">6 members · 3,241 solved · season 4</text>
    <rect x="590" y="84" width="104" height="27" rx="13.5" fill="#2A2140" stroke="#4C3B78"/>
    <text x="642" y="102" text-anchor="middle" fill="#C7A6FF" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="700">COHORT</text>

    <line x1="68" y1="140" x2="692" y2="140" stroke="#30343C"/>

    <!-- rows -->
    <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
      <!-- 1 -->
      <rect x="58" y="150" width="644" height="44" rx="10" fill="#2B2415" stroke="#5C4517"/>
      <circle cx="82" cy="172" r="13" fill="url(#gold)"/>
      <text x="82" y="177" text-anchor="middle" fill="#1B1408" font-size="12" font-weight="800">1</text>
      <circle cx="116" cy="172" r="13" fill="#F59E0B"/>
      <text x="116" y="177" text-anchor="middle" fill="#1B1408" font-size="11" font-weight="800">M</text>
      <text x="140" y="169" fill="#F5F6F7" font-size="12" font-weight="700">maya</text>
      <text x="140" y="183" fill="#B9A26A" font-size="9">🔥 21-day streak</text>
      <text x="598" y="177" text-anchor="end" fill="#FFD76E" font-size="12" font-weight="800">842</text>
      <text x="632" y="177" fill="#7EE787" font-size="10" font-weight="700">+64</text>

      <!-- 2 -->
      <circle cx="82" cy="220" r="13" fill="#3A3F4B"/>
      <text x="82" y="225" text-anchor="middle" fill="#C9D1D9" font-size="12" font-weight="800">2</text>
      <circle cx="116" cy="220" r="13" fill="#3B82F6"/>
      <text x="116" y="225" text-anchor="middle" fill="#EAF2FF" font-size="11" font-weight="800">A</text>
      <text x="140" y="224" fill="#E6E8EB" font-size="12" font-weight="700">arjun</text>
      <text x="598" y="224" text-anchor="end" fill="#D7DBE0" font-size="12" font-weight="700">714</text>
      <text x="632" y="224" fill="#7EE787" font-size="10" font-weight="700">+51</text>

      <!-- 3 -->
      <circle cx="82" cy="264" r="13" fill="#3A2A1F"/>
      <text x="82" y="269" text-anchor="middle" fill="#E8A87C" font-size="12" font-weight="800">3</text>
      <circle cx="116" cy="264" r="13" fill="#10B981"/>
      <text x="116" y="269" text-anchor="middle" fill="#06281D" font-size="11" font-weight="800">S</text>
      <text x="140" y="268" fill="#E6E8EB" font-size="12" font-weight="700">sofia</text>
      <text x="598" y="268" text-anchor="end" fill="#D7DBE0" font-size="12" font-weight="700">618</text>
      <text x="632" y="268" fill="#7EE787" font-size="10" font-weight="700">+38</text>

      <!-- 4 -->
      <circle cx="82" cy="308" r="13" fill="#2A2E36"/>
      <text x="82" y="313" text-anchor="middle" fill="#8B949E" font-size="12" font-weight="800">4</text>
      <circle cx="116" cy="308" r="13" fill="#8B5CF6"/>
      <text x="116" y="313" text-anchor="middle" fill="#F3EEFF" font-size="11" font-weight="800">D</text>
      <text x="140" y="312" fill="#E6E8EB" font-size="12" font-weight="700">dev</text>
      <text x="598" y="312" text-anchor="end" fill="#D7DBE0" font-size="12" font-weight="700">559</text>
      <text x="632" y="312" fill="#7EE787" font-size="10" font-weight="700">+27</text>

      <!-- 5 -->
      <circle cx="82" cy="352" r="13" fill="#2A2E36"/>
      <text x="82" y="357" text-anchor="middle" fill="#8B949E" font-size="12" font-weight="800">5</text>
      <circle cx="116" cy="352" r="13" fill="#EC4899"/>
      <text x="116" y="357" text-anchor="middle" fill="#FFF0F7" font-size="11" font-weight="800">L</text>
      <text x="140" y="356" fill="#E6E8EB" font-size="12" font-weight="700">lena</text>
      <text x="598" y="356" text-anchor="end" fill="#D7DBE0" font-size="12" font-weight="700">508</text>
      <text x="632" y="356" fill="#7EE787" font-size="10" font-weight="700">+19</text>
    </g>

    <text x="68" y="384" fill="#6F7B8C" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10">LeetGo · /cohort leaderboard · cached 5 min</text>
  </g>

  <text x="720" y="424" text-anchor="end" fill="#46566D" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="600">leetgo v3.0</text>
</svg>
