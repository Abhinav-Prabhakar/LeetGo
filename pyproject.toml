[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leetgo"
version = "3.0.0"
description = "A production-grade Discord bot for tracking LeetCode progress, cohorts, goals and streaks."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "LeetGo Contributors" }]
keywords = ["discord", "leetcode", "discord-bot", "python", "study-group", "competitive-programming"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "discord.py>=2.5,<3",
  "aiohttp>=3.9,<4",
  "aiosqlite>=0.20,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.10",
  "pre-commit>=3.7",
]

[project.scripts]
leetgo = "leetgo.__main__:main"

[project.urls]
Homepage = "https://github.com/Abhinav-Prabhakar/LeetGo"
Issues = "https://github.com/Abhinav-Prabhakar/LeetGo/issues"
Changelog = "https://github.com/Abhinav-Prabhakar/LeetGo/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["leetgo*"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv", "build", "dist", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "C4", "DTZ", "T20", "PIE", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["DTZ", "T20"]
"leetgo/logging_setup.py" = ["T20"]
"leetgo/__main__.py" = ["T201"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = false
ignore_missing_imports = true
exclude = ["tests/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning:discord.*"]

[tool.coverage.run]
source = ["leetgo"]
branch = true
omit = ["leetgo/__main__.py", "leetgo/health.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
