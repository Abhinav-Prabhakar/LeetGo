services:
  leetgo:
    build:
      context: .
    image: leetgo:local
    container_name: leetgo
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      DATABASE_PATH: /app/data/leetgo.db
      LOG_FILE: /app/logs/leetgo.log
      HEALTH_HOST: 0.0.0.0
      HEALTH_PORT: 8080
      ENVIRONMENT: production
    ports:
      - "8080:8080"
    volumes:
      - leetgo-data:/app/data
      - leetgo-logs:/app/logs
    stop_grace_period: 30s

volumes:
  leetgo-data:
  leetgo-logs:
